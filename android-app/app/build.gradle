plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tranhoang.floating'
    compileSdk 34

    defaultConfig {
        applicationId "com.tranhoang.floating"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}